name: Publish MZpack AI Skill release

on:
  push:
    tags:
      - 'skill-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing skill release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" == skill-v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Check out the tagged release
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$RELEASE_TAG" == "skill-v$version" ]]
          python3 -c 'import json, os; manifest = json.load(open("skill-manifest.json")); assert os.environ["RELEASE_TAG"] == "skill-v" + manifest["version"], "Tag and manifest version disagree"'

      - name: Create portable skill ZIP
        run: >-
          git archive --format=zip --prefix=mzpack-ai-skill/ --output=mzpack-ai-skill.zip "$RELEASE_TAG" --
          SKILL.md VERSION skill-manifest.json AGENTS.md CLAUDE.md README.md CHANGELOG.md LICENSE
          Directory.Build.props docs samples templates

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" mzpack-ai-skill.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" mzpack-ai-skill.zip --repo "$GITHUB_REPOSITORY" \
              --title "MZpack AI Skill $RELEASE_TAG" --generate-notes --verify-tag
          fi
