name: Publish MZpack AI Skill release

on:
  push:
    tags:
      - 'skill-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create portable skill ZIP
        run: git archive --format=zip --prefix=mzpack-ai-skill/ --output=mzpack-ai-skill.zip "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mzpack-ai-skill.zip --title "MZpack AI Skill $GITHUB_REF_NAME" --generate-notes
